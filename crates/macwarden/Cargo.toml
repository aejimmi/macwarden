[package]
name = "macwarden"
description = "A profile-based daemon firewall for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "macwarden"
path = "src/main.rs"

# `capture-live` is ON by default so real users get live BPF capture out of the
# box (no flag to discover). Linux CI stays clean because the vendored `pcap`
# dep is target-gated to macOS in `crates/capture` — the feature turns on, but
# the platform gate leaves `pcap` out of the non-macOS graph, and the live code
# in `packet_source.rs` is additionally `all(feature = "capture-live", macos)`.
# At runtime the daemon prefers the real `LiveSource` when it has BPF access
# (root / `access_bpf`), else falls back to the `DemoSource` (clearly labeled).
[features]
default = ["capture-live"]
capture-live = ["capture/capture-live"]

